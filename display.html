<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>จอสนาม — Gate Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== EasyKids Robotics theme tokens ===== */
    --void:#0a0518; --void-2:#170a2e;
    --brand:#7c3aed; --brand-bright:#a78bfa;
    --panel:#160d29; --panel-2:#1d1139;
    --line:rgba(167,139,250,.22);
    --ink:#f5f2ff; --dim:#9384b8;
    /* functional state colors — unchanged meaning */
    --amber:#ffb020; --red:#ff3b3b; --green:#28e07a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;
    font-family:'Kanit','Segoe UI',Tahoma,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 60vw 60vw at 6% 6%, rgba(124,58,237,.32), transparent 60%),
      radial-gradient(ellipse 55vw 55vw at 96% 94%, rgba(40,224,122,.10), transparent 60%),
      linear-gradient(160deg, var(--void) 0%, var(--void-2) 55%, var(--void) 100%);
    overflow:hidden;
  }
  /* subtle circuit-grid texture, purely decorative */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(167,139,250,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,.05) 1px, transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 40%, black 0%, transparent 75%);
            mask-image:radial-gradient(ellipse 70% 70% at 50% 40%, black 0%, transparent 75%);
  }

  /* ===== logo / brand slot ===== */
  .brand-bar{position:fixed;top:2vh;left:2vw;display:flex;align-items:center;gap:1vw;z-index:5;}
  .brand-logo{height:5vh;width:auto;display:block;
    filter:drop-shadow(0 2px 14px rgba(124,58,237,.55));}
  .brand-logo:not([src]),.brand-logo[src=""]{display:none;}
  .brand-text{line-height:1.25;}
  .brand-text .name{font-weight:800;font-size:1.3vw;letter-spacing:.14em;
    text-transform:uppercase;color:var(--brand-bright);}
  .brand-text .sub{font-weight:500;font-size:.95vw;letter-spacing:.1em;color:var(--dim);}

  .wrap{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3.6vh;padding:2vh 2vw;text-align:center;}
  .names{font-size:9vw;font-weight:800;letter-spacing:.02em;text-shadow:0 0 46px rgba(124,58,237,.4);}
  .team{font-size:3.6vw;color:var(--dim);font-weight:600;}

  .state-badge{font-size:3.2vw;padding:1.6vh 3.6vw;border-radius:999px;
    border:2px solid var(--line);letter-spacing:.14em;font-weight:800;
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    box-shadow:0 10px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);}
  .state-IDLE{color:var(--dim);}
  .state-WAITING{color:var(--amber);}
  .state-READY{color:#5ac8ff;}
  .state-RACING{color:var(--green);}
  .state-FINISH{color:#c084fc;}
  .state-TIMEOUT,.state-DQ,.state-FALSE_START{color:var(--red);}

  .timers{display:flex;gap:3vw;align-items:flex-end;}
  .timer-block{display:flex;flex-direction:column;align-items:center;gap:1.4vh;
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);border-radius:2vw;padding:2.4vh 2vw;
    box-shadow:0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.03);
    min-width:0;}
  .timer-block.final-robot{margin-top:0;}
  .timer-label{font-size:2.2vw;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;}
  .timer-value{font-size:13.5vw;font-weight:900;font-variant-numeric:tabular-nums;
    line-height:1;text-shadow:0 0 44px rgba(255,255,255,.08);white-space:nowrap;}
  .main-timer.warn{color:var(--amber);}
  .main-timer.danger{color:var(--red);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .robot-timer{color:var(--green);text-shadow:0 0 38px rgba(40,224,122,.5);}

  .countdown-overlay{position:fixed;inset:0;display:none;align-items:center;
    justify-content:center;background:rgba(8,4,20,.88);font-size:30vw;font-weight:900;
    color:var(--amber);text-shadow:0 0 70px rgba(255,176,32,.5);z-index:10;}

  /* ===== F1 start-lights: full-screen dramatic takeover for TOP4 ===== */
  .lights-overlay{position:fixed;inset:0;z-index:8;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120vw 120vw at 50% 50%, rgba(30,15,70,.97), #04010d 82%);
    opacity:0;pointer-events:none;transition:opacity 1.2s ease;}
  .lights-overlay.show{opacity:1;}
  .lights-big{display:flex;gap:3vw;}
  .bulb-big{width:14vw;height:14vw;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a1a1a, #1c0d0d);
    border:1vw solid rgba(255,255,255,.08);transition:background .15s, box-shadow .15s, border-color .15s;}
  .bulb-big.on{background:radial-gradient(circle at 35% 30%, #ff8a8a, var(--red));
    box-shadow:0 0 9vw rgba(255,59,59,.85);border-color:rgba(255,255,255,.3);}
  .bulb-big.go{background:radial-gradient(circle at 35% 30%, #8dffcf, var(--green))!important;
    box-shadow:0 0 11vw rgba(40,224,122,.9)!important;
    border-color:rgba(255,255,255,.4)!important;}
  .hidden{display:none;}
</style>
</head>
<body>
  <!-- logo slot: swap src for your event / school / sponsor logo -->
  <div class="brand-bar">
    <img class="brand-logo" src="logo.png" alt="Event logo" onerror="this.style.display='none'">
    <div class="brand-text">
      <div class="name">EasyKids Robotics</div>
      <div class="sub">Racing Gate</div>
    </div>
  </div>

  <div class="countdown-overlay" id="countdownOverlay">3</div>

  <!-- TOP4: full-screen F1 start lights, fades in during LIGHTS state -->
  <div class="lights-overlay" id="lightsOverlay">
    <div class="lights-big" id="lightsBig">
      <div class="bulb-big"></div><div class="bulb-big"></div><div class="bulb-big"></div>
      <div class="bulb-big"></div><div class="bulb-big"></div>
    </div>
  </div>

  <div class="wrap">
    <div>
      <div class="names" id="childName">รอผู้เข้าแข่งขัน…</div>
      <div class="team" id="teamName">&nbsp;</div>
    </div>

    <div class="state-badge" id="stateBadge">IDLE</div>

    <!-- Normal mode -->
    <div class="timers" id="normalTimers">
      <div class="timer-block">
        <div class="timer-label">เวลาหลัก 3 นาที</div>
        <div class="timer-value main-timer" id="mainTimer">3:00</div>
      </div>
      <div class="timer-block">
        <div class="timer-label">เวลาหุ่นวิ่ง</div>
        <div class="timer-value robot-timer" id="robotTimer">0.00</div>
      </div>
    </div>

    <!-- Final mode: robot timer only (lights now live in the full-screen overlay above) -->
    <div id="finalPanel" class="hidden">
      <div class="timer-block final-robot">
        <div class="timer-label">เวลาหุ่นวิ่ง</div>
        <div class="timer-value robot-timer" id="robotTimerFinal">0.00</div>
      </div>
    </div>
  </div>

<script>
const WS_URL = `ws://${location.hostname}:1880/ws/gate`;
let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (ev)=>{
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") render(msg.data);
  };
  ws.onclose = ()=> setTimeout(connect, 1500);
}
connect();

// sync ค่าล่าสุดทันทีตอนเปิดหน้า/รีเฟรช (เดี๋ยวนี้ server ส่งเฉพาะตอนมี event จริง
// ไม่ได้ broadcast รัวๆ แล้ว จึงต้องดึงค่าล่าสุดเองครั้งแรกที่โหลดหน้า)
fetch(`http://${location.hostname}:1880/api/state`)
  .then(r=>r.json()).then(d=>{ if (d && d.state) render(d); }).catch(()=>{});

function fmtMs(ms){
  if (ms === null || ms === undefined) return "--.--";
  const s = Math.max(0, ms)/1000;
  return s.toFixed(2);
}
function fmtMainMs(ms){
  if (ms === null || ms === undefined) return "3:00";
  const totalSec = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

// --- LiveTimer: วิ่งหลอกๆ ต่อเนื่องด้วย requestAnimationFrame ระหว่าง
//     packet จาก server (~5Hz) มาถึง, sync ค่าใหม่ทุกครั้งที่มี state เข้ามา,
//     พอ running=false (เช่น FINISH/TIMEOUT/DQ) จะหยุดนิ่งที่ค่าจริงจาก server ทันที
class LiveTimer{
  constructor(direction){ this.direction = direction; this.value=null; this.baseTs=null; this.running=false; }
  // delayMs = เวลาที่ "เนียนหายไป" ระหว่างตัด sensor จริงที่ controller กับตอน
  // browser ได้รับ packet (network + queue) — บวก/ลบชดเชยตรงนี้ก่อนเริ่มนับหลอก
  // จะได้ไม่รู้สึกดีเลย์ตั้งแต่วินาทีแรกที่ตัด sensor
  update(value, running, delayMs=0){
    if (value === null || value === undefined){ this.value = null; this.running = false; return; }
    if (running){
      this.value = this.direction === 'down' ? Math.max(0, value - delayMs) : value + delayMs;
    } else {
      this.value = value;   // หยุดแล้ว = ค่าจริงเป๊ะๆ ห้ามชดเชย delay เด็ดขาด
    }
    this.baseTs = performance.now();
    this.running = running;
  }
  read(){
    if (this.value === null) return null;
    if (!this.running) return this.value;             // หยุดแล้ว = ค่าจริงเป๊ะๆ จาก server
    const dt = performance.now() - this.baseTs;         // วิ่งหลอกต่อจาก packet ล่าสุด
    return this.direction === 'down' ? Math.max(0, this.value - dt) : this.value + dt;
  }
}
// ประมาณดีเลย์เครือข่ายจาก server timestamp (d.ts) เทียบเวลาเครื่อง browser
// กันไว้ไม่ให้พังถ้านาฬิกา Pi กับจอไม่ตรงกันมากผิดปกติ (เกิน 3 วิ = เมิน ถือเป็น 0)
function estimateDelayMs(serverTs){
  if (!serverTs) return 0;
  const d = Date.now() - serverTs;
  if (!isFinite(d) || d < 0 || d > 3000) return 0;
  return d;
}
const mainLive = new LiveTimer('down');
const robotLive = new LiveTimer('up');
const robotFinalLive = new LiveTimer('up');
let curMode = 'normal';
let lightsHideTimer = null;
let prevLightsGo = false;

function updateLightsOverlay(d){
  const overlay = document.getElementById('lightsOverlay');
  const bulbs = document.querySelectorAll('#lightsBig .bulb-big');

  if (d.state === 'LIGHTS'){
    // กำลังไล่ไฟแดง — โชว์เต็มจอค้างไว้ตลอด ไม่มี auto-hide
    clearTimeout(lightsHideTimer);
    lightsHideTimer = null;
    overlay.classList.add('show');
    bulbs.forEach((b,i)=>{
      const lit = (i+1) <= d.light_stage;
      b.classList.toggle('on', lit);
      b.classList.remove('go');
    });
    prevLightsGo = false;
  } else if (d.lights_go && !prevLightsGo){
    // ขอบขาขึ้น: เพิ่งปล่อยตัว (state เด้งเป็น RACING มาพร้อมกันในข้อความเดียวกัน)
    // โชว์เขียวเต็มจอค้างไว้แป๊บนึงให้เห็นชัดๆ ก่อนค่อย fade กลับไปหน้าจับเวลา
    clearTimeout(lightsHideTimer);
    overlay.classList.add('show');
    bulbs.forEach(b=>{ b.classList.remove('on'); b.classList.add('go'); });
    lightsHideTimer = setTimeout(()=>{
      overlay.classList.remove('show');
      lightsHideTimer = null;
    }, 900);
    prevLightsGo = true;
  } else if (!d.lights_go){
    prevLightsGo = false;
    if (!lightsHideTimer) overlay.classList.remove('show');
  }
  // ถ้า lights_go ยังเป็น true ต่อเนื่อง (RACING/FINISH ข้อความถัดๆ ไป) ไม่ต้อง
  // ทำอะไรซ้ำ ปล่อยให้ timer ที่ตั้งไว้ครั้งแรกทำงานของมันไปตามปกติ
}

function renderLoop(){
  if (curMode !== 'final'){
    const mt = document.getElementById('mainTimer');
    const ms = mainLive.read();
    mt.textContent = fmtMainMs(ms);
    mt.className = "timer-value main-timer";
    if (ms !== null && ms <= 30000) mt.classList.add("danger");
    else if (ms !== null && ms <= 60000) mt.classList.add("warn");
    document.getElementById('robotTimer').textContent = fmtMs(robotLive.read());
  } else {
    document.getElementById('robotTimerFinal').textContent = fmtMs(robotFinalLive.read());
  }
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

function render(d){
  document.getElementById('childName').textContent = d.child_name || "รอผู้เข้าแข่งขัน…";
  document.getElementById('teamName').textContent =
    [d.team_name, d.class_name].filter(Boolean).join(" • ") || "\u00A0";

  const badge = document.getElementById('stateBadge');
  badge.textContent = d.state;
  badge.className = "state-badge state-" + d.state;

  const isFinal = d.mode === "final";
  curMode = d.mode;
  document.getElementById('normalTimers').classList.toggle('hidden', isFinal);
  document.getElementById('finalPanel').classList.toggle('hidden', !isFinal);

  const delay = estimateDelayMs(d.ts);
  if (!isFinal){
    const mainRunning = ['WAITING','READY','RACING'].includes(d.state);
    const robotRunning = d.state === 'RACING';
    mainLive.update(d.main_timer_ms, mainRunning, delay);
    robotLive.update(d.robot_timer_ms ?? 0, robotRunning, delay);
  } else {
    const robotRunning = d.state === 'RACING';
    robotFinalLive.update(d.robot_timer_ms ?? 0, robotRunning, delay);
  }

  // TOP4: ไฟสตาร์ทเต็มจอ — ค่อยๆ fade มืดลงตอนเข้า state LIGHTS, โชว์หลอด
  // ใหญ่เต็มจอ, ค้างที่เขียวแป๊บนึงตอนปล่อยตัวก่อน fade กลับออก
  updateLightsOverlay(d);

  // 3-2-1 overlay (normal mode start countdown)
  const overlay = document.getElementById('countdownOverlay');
  if (d.countdown){
    overlay.style.display = 'flex';
    overlay.textContent = d.countdown;
    clearTimeout(window._cdTimer);
    window._cdTimer = setTimeout(()=> overlay.style.display='none', 900);
  }
}
</script>
</body>
</html>
