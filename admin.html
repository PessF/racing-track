<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>🖥️ Admin Dashboard (โต๊ะควบคุมกลาง)</h1>
    <p>สถานะการเชื่อมต่อ: <strong id="ws-status" style="color: red;">กำลังเชื่อมต่อ...</strong></p>
    
    <hr>
    <h2>🎛️ สับรางโหมดการแข่งขันหลัก</h2>
    <button onclick="changeMode('ranking')" style="padding: 15px; font-size: 16px; margin-right: 10px;">เปิดโหมดคัดเลือก (Ranking Mode)</button>
    <button onclick="changeMode('knockout')" style="padding: 15px; font-size: 16px;">เปิดโหมดแบทเทิล (Knockout Mode)</button>

    <hr>
    <h2>📢 คำสั่งฉุกเฉิน</h2>
    <button onclick="sendAction('request_match_reset')" style="padding: 10px; background-color: #ff4d4d; color: white; border: none;">สั่ง รีเซ็ตแมตช์ ทั้งหมด</button>

    <hr>
    <h3>📡 Data Logs (ข้อความดิบในระบบ)</h3>
    <textarea id="log-area" rows="8" cols="70" readonly style="background-color: #eee;"></textarea>

    <script>
        const wsUrl = "ws://" + window.location.hostname + ":1880/ws/competition";
        let ws;

        function connectWS() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                document.getElementById("ws-status").innerText = "เชื่อมต่อสำเร็จ";
                document.getElementById("ws-status").style.color = "green";
            };
            ws.onmessage = (event) => {
                const log = document.getElementById("log-area");
                log.value += event.data + "\n";
                log.scrollTop = log.scrollHeight;
            };
            ws.onclose = () => {
                document.getElementById("ws-status").innerText = "การเชื่อมต่อหลุด - กำลังลองใหม่...";
                document.getElementById("ws-status").style.color = "red";
                setTimeout(connectWS, 2000);
            };
        }

        function changeMode(mode) {
            ws.send(JSON.stringify({ "sender": "admin", "action": "change_global_mode", "target_mode": mode }));
        }

        function sendAction(actionName) {
            ws.send(JSON.stringify({ "sender": "admin", "action": actionName }));
        }

        connectWS();
    </script>
</body>
</html>
