<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>หน้ากรรมการ — Gate Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ฟอนต์ Prompt โหลดจากไฟล์ local (ไม่พึ่งอินเทอร์เน็ตหน้างาน) — วางไฟล์
     .woff2 (และ/หรือ .ttf สำรอง) ไว้ที่ web/fonts/ ตามชื่อไฟล์ด้านล่าง -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@font-face{font-family:'Prompt';font-weight:400;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-Regular.woff2') format('woff2'),
      url('fonts/Prompt-Regular.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:500;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-Medium.woff2') format('woff2'),
      url('fonts/Prompt-Medium.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:600;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-SemiBold.woff2') format('woff2'),
      url('fonts/Prompt-SemiBold.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:700;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-Bold.woff2') format('woff2'),
      url('fonts/Prompt-Bold.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:800;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-ExtraBold.woff2') format('woff2'),
      url('fonts/Prompt-ExtraBold.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:900;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-Black.woff2') format('woff2'),
      url('fonts/Prompt-Black.ttf') format('truetype');}
</style>
<style>
  :root{--bg:#0f1420;--panel:#161d2c;--line:#26314a;--ink:#eef2f8;--dim:#8892a6;
        --accent:#4d8dff;--green:#28e07a;--red:#ff4d4d;--amber:#ffb020;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt','Segoe UI',Tahoma,sans-serif;
       padding:20px;max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:18px;margin-bottom:16px;}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--dim);text-transform:uppercase;
            letter-spacing:.08em;}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px;}
  input,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
        background:#0c1120;color:var(--ink);font-size:15px;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  button{flex:1;min-width:130px;padding:14px 10px;border:none;border-radius:10px;
        font-size:14px;font-weight:700;cursor:pointer;color:#08101f;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  .b-primary{background:var(--accent);color:#fff;}
  .b-green{background:var(--green);}
  .b-red{background:var(--red);color:#fff;}
  .b-amber{background:var(--amber);}
  .b-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .status{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .pill{padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid var(--line);}
  .modeSwitch{display:flex;gap:8px;margin-bottom:16px;}
  .modeSwitch button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);}
  .modeSwitch button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .field{margin-top:6px;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}
  .hidden{display:none;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
         background:#1f2a40;border:1px solid var(--line);padding:10px 18px;border-radius:10px;
         font-size:13px;opacity:0;transition:opacity .2s;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
  <h1>หน้ากรรมการ</h1>
  <div class="sub">เชื่อมกับ Pi5 ผ่าน WebSocket — เชื่อมสถานะ real-time</div>

  <div class="modeSwitch">
    <button id="modeNormalBtn" class="active" onclick="setMode('normal')">รอบคัดเลือก (Normal)</button>
    <button id="modeFinalBtn" onclick="setMode('final')">รอบ Final (Top4)</button>
  </div>

  <div class="card">
    <div class="status">
      <span>สถานะปัจจุบัน</span>
      <span class="pill" id="statePill">IDLE</span>
    </div>
    <div>ผู้เข้าแข่งขัน: <b id="curName">-</b> / <span id="curTeam">-</span></div>
    <div class="row" style="margin-top:8px;">
      <div class="field">เวลาหลัก: <span id="curMain">3:00</span></div>
      <div class="field">เวลาหุ่น: <span id="curRobot">-</span></div>
    </div>
  </div>

  <!-- NORMAL MODE PANEL -->
  <div class="card" id="normalPanel">
    <h2>ลงทะเบียนผู้เข้าแข่งขัน (รอบคัดเลือก)</h2>
    <label>ชื่อเด็ก</label><input id="f_child" placeholder="เช่น น้องพีพี">
    <div class="row">
      <div><label>ชื่อทีม</label><input id="f_team" placeholder="เช่น Robo Kids"></div>
      <div><label>รุ่น</label><input id="f_class" placeholder="เช่น รุ่นเล็ก" value="รุ่นทั่วไป"></div>
    </div>
    <div class="sub" style="margin:0 0 6px;">ไม่ต้องเลือกรอบเอง — ระบบนับรอบ 1/2/3 อัตโนมัติตอนบันทึกผลลง DB</div>
    <div class="btns">
      <button class="b-primary" onclick="setRacer()">บันทึกชื่อ</button>
      <button class="b-green" onclick="cmd('start_timer')">เริ่มนับ 3-2-1 + 3 นาที</button>
    </div>
    <div class="btns">
      <button class="b-red" onclick="cmd('dq')">ปรับแพ้ (DQ)</button>
      <button class="b-primary" onclick="cmd('confirm')">ยืนยันผล → บันทึก DB</button>
      <button class="b-ghost" onclick="cmd('reset')">Reset ฉุกเฉิน</button>
    </div>
  </div>

  <!-- FINAL MODE PANEL -->
  <div class="card hidden" id="finalPanel">
    <h2>รอบ Final — Top 4</h2>
    <label>ชื่อเด็ก</label><input id="ff_child" placeholder="เช่น น้องพีพี">
    <div class="row">
      <div><label>ชื่อทีม</label><input id="ff_team"></div>
      <div><label>อันดับที่เข้ารอบ (seed)</label><input id="ff_seed" type="number" min="1" max="4"></div>
    </div>
    <div class="btns">
      <button class="b-primary" onclick="setFinalPair()">บันทึก</button>
      <button class="b-green" onclick="cmd('start_lights')">เริ่มสัญญาณไฟ</button>
    </div>
    <div class="btns">
      <button class="b-primary" onclick="cmd('confirm')">ยืนยันผล</button>
      <button class="b-red" onclick="cmd('dq')">ปรับแพ้</button>
    </div>
    <div class="btns">
      <button class="b-ghost" onclick="cmd('reset_final')">↺ Reset</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const WS_URL = `ws://${location.hostname}:1880/ws/gate`;
let ws, curMode = "normal";

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = ()=> toast("เชื่อมต่อแล้ว");
  ws.onmessage = (ev)=>{
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") render(msg.data);
  };
  ws.onclose = ()=>{ toast("หลุดการเชื่อมต่อ กำลังต่อใหม่…"); setTimeout(connect, 1500); };
}
connect();

// sync ค่าล่าสุดทันทีตอนเปิดหน้า (server ส่งเฉพาะตอนมี event จริงแล้ว ไม่ broadcast รัว)
fetch(`http://${location.hostname}:1880/api/state`)
  .then(r=>r.json()).then(d=>{ if (d && d.state) render(d); }).catch(()=>{});

function send(obj){
  if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  else toast("ยังไม่เชื่อมต่อ");
}
function cmd(action, extra={}){ send({action, ...extra}); }

function setMode(m){
  curMode = m;
  document.getElementById('modeNormalBtn').classList.toggle('active', m==='normal');
  document.getElementById('modeFinalBtn').classList.toggle('active', m==='final');
  document.getElementById('normalPanel').classList.toggle('hidden', m!=='normal');
  document.getElementById('finalPanel').classList.toggle('hidden', m!=='final');
  cmd('set_mode', {mode:m});
}

function setRacer(){
  cmd('set_racer', {
    child_name: document.getElementById('f_child').value.trim(),
    team_name: document.getElementById('f_team').value.trim(),
    class_name: document.getElementById('f_class').value.trim() || "รุ่นทั่วไป",
  });
  toast("บันทึกชื่อแล้ว — กด 'เริ่มนับ 3-2-1' ได้เลย");
}

function setFinalPair(){
  cmd('set_final_pair', {
    child_name: document.getElementById('ff_child').value.trim(),
    team_name: document.getElementById('ff_team').value.trim(),
    seed_rank: parseInt(document.getElementById('ff_seed').value, 10),
  });
  toast("บันทึกคู่แข่งแล้ว — กด 'เริ่มไฟสัญญาณ' เมื่อพร้อม");
}

function fmtMs(ms){ return (ms===null||ms===undefined) ? "-" : (Math.max(0,ms)/1000).toFixed(2); }
function fmtMain(ms){
  if (ms===null||ms===undefined) return "3:00";
  const t = Math.max(0, Math.ceil(ms/1000));
  return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
}

// วิ่งหลอกๆ ระหว่าง packet เหมือนหน้าจอสนาม แล้ว snap เป็นค่าจริงตอนหยุด
class LiveTimer{
  constructor(direction){ this.direction = direction; this.value=null; this.baseTs=null; this.running=false; }
  update(value, running, delayMs=0){
    if (value === null || value === undefined){ this.value = null; this.running = false; return; }
    if (running){
      this.value = this.direction === 'down' ? Math.max(0, value - delayMs) : value + delayMs;
    } else {
      this.value = value;   // หยุดแล้ว = ค่าจริงเป๊ะๆ ห้ามชดเชย delay เด็ดขาด
    }
    this.baseTs = performance.now();
    this.running = running;
  }
  read(){
    if (this.value === null) return null;
    if (!this.running) return this.value;
    const dt = performance.now() - this.baseTs;
    return this.direction === 'down' ? Math.max(0, this.value - dt) : this.value + dt;
  }
}
function estimateDelayMs(serverTs){
  if (!serverTs) return 0;
  const d = Date.now() - serverTs;
  if (!isFinite(d) || d < 0 || d > 3000) return 0;
  return d;
}
const mainLive = new LiveTimer('down');
const robotLive = new LiveTimer('up');
let curModeState = 'normal';

function renderLoop(){
  document.getElementById('curMain').textContent = curModeState === 'normal' ? fmtMain(mainLive.read()) : "—";
  document.getElementById('curRobot').textContent = fmtMs(robotLive.read());
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

function render(d){
  document.getElementById('statePill').textContent = `${d.mode.toUpperCase()} / ${d.state}`;
  document.getElementById('curName').textContent = d.child_name || "-";
  document.getElementById('curTeam').textContent = [d.team_name, d.class_name].filter(Boolean).join(" • ") || "-";

  curModeState = d.mode;
  const delay = estimateDelayMs(d.ts);
  if (d.mode === 'normal'){
    mainLive.update(d.main_timer_ms, ['WAITING','READY','RACING'].includes(d.state), delay);
  }
  robotLive.update(d.robot_timer_ms ?? 0, d.state === 'RACING', delay);
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}
</script>
</body>
</html>
