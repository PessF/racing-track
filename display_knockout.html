<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Display - Knockout Round</title>
</head>
<body id="bg" style="background-color: #111; color: white; font-family: sans-serif; text-align: center; padding-top: 30px;">
    
    <h1 id="title">📺 FIELD 1 - BATTLE MODE</h1>
    
    <div style="background-color: #222; display: inline-block; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
        <div id="lights" style="font-size: 50px; letter-spacing: 15px;">⚫⚫⚫⚫⚫</div>
        <h3 id="countdown-hint" style="color: yellow; margin: 10px 0 0 0;">READY TO START</h3>
    </div>

    <div>
        <h1 style="font-size: 160px; margin: 10px 0;" id="big-timer">0.000</h1>
        <h2 id="status-text">STATUS: IDLE</h2>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fieldNum = urlParams.get('field') || '1';
        document.getElementById("title").innerText = `📺 FIELD ${fieldNum} - BATTLE MODE`;

        const wsUrl = "ws://" + window.location.hostname + ":1880/ws/competition";
        let ws;

        function connectWS() {
            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                // ดักจับสัญญาณไฟปล่อยตัว (ซิงค์ตรงกันทุกหน้าจอ)
                if (msg.action === "global_countdown_start") {
                    startF1Countdown(msg.green_timestamp);
                }

                if (msg.field === `field${fieldNum}`) {
                    if (msg.action === "ui_state_update") {
                        document.getElementById("status-text").innerText = "STATUS: " + msg.status;
                        if (msg.status === "FINISHED") {
                            document.getElementById("big-timer").innerText = parseFloat(msg.lap_time).toFixed(3);
                            document.getElementById("bg").style.backgroundColor = "#1b4d1b";
                        } else if (msg.status === "FALSE_START") {
                            document.getElementById("big-timer").innerText = "❌ FOUL";
                            document.getElementById("bg").style.backgroundColor = "#661111";
                        } else if (msg.status === "IDLE") {
                            document.getElementById("big-timer").innerText = "0.000";
                            document.getElementById("bg").style.backgroundColor = "#111";
                            document.getElementById("lights").innerText = "⚫⚫⚫⚫⚫";
                            document.getElementById("countdown-hint").innerText = "READY";
                        }
                    }
                }
            };
            ws.onclose = () => { setTimeout(connectWS, 2000); };
        }

        // ใช้ requestAnimationFrame เพื่อความเที่ยงตรงระดับมิลลิวินาที
        function startF1Countdown(targetTime) {
            function update() {
                const now = Date.now();
                const diff = targetTime - now;

                if (diff <= 0) {
                    document.getElementById("lights").innerText = "🟢🟢🟢🟢🟢";
                    document.getElementById("countdown-hint").innerText = "🏁 GO!!!";
                    return;
                }

                if (diff > 4000)      { document.getElementById("lights").innerText = "🔴⚫⚫⚫⚫"; }
                else if (diff > 3000) { document.getElementById("lights").innerText = "🔴🔴⚫⚫⚫"; }
                else if (diff > 2000) { document.getElementById("lights").innerText = "🔴🔴🔴⚫⚫"; }
                else if (diff > 1000) { document.getElementById("lights").innerText = "🔴🔴🔴🔴⚫"; }
                else if (diff > 0)    { document.getElementById("lights").innerText = "🔴🔴🔴🔴🔴"; }

                document.getElementById("countdown-hint").innerText = `รอสัญญาณปล่อยตัว... ${(diff/1000).toFixed(2)}s`;
                requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        connectWS();
    </script>
</body>
</html>
