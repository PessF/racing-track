<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Central Leaderboard</title>
</head>
<body style="background-color: #111; color: white; font-family: sans-serif; text-align: center; padding: 20px;">

    <h1>📊 Central Arena Display (จอกลางงาน)</h1>
    <h3 style="color: #888;">โหมดปัจจุบัน: <span id="mode-text">กำลังโหลด...</span></h3>
    <hr style="border-color: #333;">

    <div id="panel-ranking" style="display: none;">
        <h2>🏆 TOP SPEED RANKING LEADERBOARD</h2>
        <table border="1" style="margin: 0 auto; width: 60%; color: white; border-color: #333; font-size: 20px;" cellpadding="10">
            <tr style="background-color: #222;">
                <th>อันดับ</th><th>รหัสผู้แข่งขัน</th><th>เวลาที่ดีที่สุด</th>
            </tr>
            <tbody id="leaderboard-rows">
                <tr><td>1</td><td>105</td><td>4.120 วินาที</td></tr>
                <tr><td>2</td><td>102</td><td>4.455 วินาที</td></tr>
                <tr><td>3</td><td>109</td><td>5.012 วินาที</td></tr>
            </tbody>
        </table>
    </div>

    <div id="panel-knockout" style="display: none;">
        <h2>⚔️ KNOCKOUT DOUBLE DUEL</h2>
        <div style="display: flex; justify-content: space-around; margin-top: 40px;">
            <div id="box-f1" style="width: 45%; border: 4px solid #333; padding: 20px; background-color: #1a1a2e;">
                <h2>🟦 FIELD 1</h2>
                <h1 id="time-f1" style="font-size: 80px; margin: 10px 0;">0.000</h1>
                <h3 id="status-f1">IDLE</h3>
            </div>
            <div id="box-f2" style="width: 45%; border: 4px solid #333; padding: 20px; background-color: #2e1a1a;">
                <h2>🟥 FIELD 2</h2>
                <h1 id="time-f2" style="font-size: 80px; margin: 10px 0;">0.000</h1>
                <h3 id="status-f2">IDLE</h3>
            </div>
        </div>
        <h1 id="winner-banner" style="color: gold; font-size: 50px; margin-top: 30px;"></h1>
    </div>

    <script>
        const wsUrl = "ws://" + window.location.hostname + ":1880/ws/competition";
        let ws;
        let t1 = 0, t2 = 0;
        let f1Done = false, f2Done = false;

        function connectWS() {
            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                // ดักรับคำสั่งเปลี่ยนโครงหน้าจอจากบอร์ดกลางแอดมิน
                if (msg.action === "ui_mode_change" || msg.action === "force_redirect") {
                    const targetMode = msg.mode || msg.target;
                    switchView(targetMode);
                }

                // อัปเดตเวลาวิ่งคู่ขนานรอบแบทเทิล
                if (msg.action === "ui_state_update") {
                    if (msg.field === "field1") {
                        document.getElementById("status-f1").innerText = msg.status;
                        if(msg.lap_time) {
                            t1 = parseFloat(msg.lap_time);
                            document.getElementById("time-f1").innerText = t1.toFixed(3);
                            if(msg.status === "FINISHED") f1Done = true;
                        }
                    }
                    if (msg.field === "field2") {
                        document.getElementById("status-f2").innerText = msg.status;
                        if(msg.lap_time) {
                            t2 = parseFloat(msg.lap_time);
                            document.getElementById("time-f2").innerText = t2.toFixed(3);
                            if(msg.status === "FINISHED") f2Done = true;
                        }
                    }

                    if(f1Done && f2Done) { checkWinner(); }
                }
            };
            ws.onclose = () => { setTimeout(connectWS, 2000); };
        }

        function switchView(mode) {
            document.getElementById("mode-text").innerText = mode.toUpperCase();
            if(mode === "ranking") {
                document.getElementById("panel-ranking").style.display = "block";
                document.getElementById("panel-knockout").style.display = "none";
            } else {
                document.getElementById("panel-ranking").style.display = "none";
                document.getElementById("panel-knockout").style.display = "block";
                resetKO();
            }
        }

        function checkWinner() {
            const banner = document.getElementById("winner-banner");
            if(t1 < t2) {
                banner.innerText = "🏆 FIELD 1 WIN!!! ⭐";
                document.getElementById("box-f1").style.borderColor = "gold";
            } else if(t2 < t1) {
                banner.innerText = "🏆 FIELD 2 WIN!!! ⭐";
                document.getElementById("box-f2").style.borderColor = "gold";
            } else {
                banner.innerText = "DRAW (เวลาเท่ากัน)";
            }
        }

        function resetKO() {
            t1 = 0; t2 = 0; f1Done = false; f2Done = false;
            document.getElementById("time-f1").innerText = "0.000";
            document.getElementById("time-f2").innerText = "0.000";
            document.getElementById("winner-banner").innerText = "";
            document.getElementById("box-f1").style.borderColor = "#333";
            document.getElementById("box-f2").style.borderColor = "#333";
        }

        connectWS();
    </script>
</body>
</html>
