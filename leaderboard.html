<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== EasyKids Robotics theme tokens ===== */
    --void:#0a0518; --void-2:#170a2e;
    --brand:#7c3aed; --brand-bright:#a78bfa;
    --panel:#160d29; --panel-2:#1d1139;
    --line:rgba(167,139,250,.22);
    --ink:#f5f2ff; --dim:#9384b8;
    /* podium colors — unchanged meaning */
    --gold:#ffd166;--silver:#cdd6e5;--bronze:#e0a672;--green:#28e07a;
  }
  *{box-sizing:border-box;}
  body{margin:0;
    font-family:'Kanit','Segoe UI',Tahoma,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 60vw 60vw at 6% -4%, rgba(124,58,237,.32), transparent 60%),
      radial-gradient(ellipse 55vw 55vw at 96% 100%, rgba(40,224,122,.10), transparent 60%),
      linear-gradient(160deg, var(--void) 0%, var(--void-2) 55%, var(--void) 100%);
    padding:3vw 4vw;
    min-height:100vh;
  }
  /* subtle circuit-grid texture, purely decorative */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(167,139,250,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,.05) 1px, transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, black 0%, transparent 75%);
            mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, black 0%, transparent 75%);
  }

  .page{position:relative;z-index:1;max-width:1400px;margin:0 auto;}

  /* ===== logo / brand header ===== */
  .page-header{display:flex;align-items:center;justify-content:center;gap:18px;
    margin:0 0 2.2vw;flex-wrap:wrap;text-align:left;}
  .brand-logo{height:64px;width:auto;display:block;
    filter:drop-shadow(0 2px 14px rgba(124,58,237,.55));}
  .brand-logo:not([src]),.brand-logo[src=""]{display:none;}
  .header-text h1{font-size:2.6vw;margin:0;letter-spacing:.05em;font-weight:800;}
  .header-text .subtitle{font-size:1.1vw;color:var(--dim);letter-spacing:.2em;
    text-transform:uppercase;font-weight:600;}

  .list{display:flex;flex-direction:column;gap:1vw;}
  .row{display:flex;align-items:center;gap:2vw;position:relative;overflow:hidden;
       background:linear-gradient(135deg, var(--panel), var(--panel-2));
       border:1px solid var(--line);border-radius:20px;padding:1.4vw 2vw 1.4vw 2.6vw;
       box-shadow:0 12px 34px rgba(0,0,0,.35);
       transition:transform .5s cubic-bezier(.4,0,.2,1), background .3s;}
  .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
    background:var(--brand);opacity:.45;}
  .row:nth-child(1)::before{background:var(--gold);opacity:1;box-shadow:0 0 20px rgba(255,209,102,.6);}
  .row:nth-child(2)::before{background:var(--silver);opacity:1;box-shadow:0 0 16px rgba(205,214,229,.4);}
  .row:nth-child(3)::before{background:var(--bronze);opacity:1;box-shadow:0 0 16px rgba(224,166,114,.4);}

  .rank{font-size:2vw;font-weight:900;width:3.8vw;height:3.8vw;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:rgba(255,255,255,.03);border:2px solid var(--line);color:var(--dim);}
  .row:nth-child(1) .rank{color:#2a1806;border-color:var(--gold);
    background:linear-gradient(160deg,#ffe9b0,var(--gold));box-shadow:0 0 26px rgba(255,209,102,.5);}
  .row:nth-child(2) .rank{color:#1c2230;border-color:var(--silver);
    background:linear-gradient(160deg,#f2f5fa,var(--silver));box-shadow:0 0 20px rgba(205,214,229,.35);}
  .row:nth-child(3) .rank{color:#2e1809;border-color:var(--bronze);
    background:linear-gradient(160deg,#f3cd9e,var(--bronze));box-shadow:0 0 20px rgba(224,166,114,.35);}

  .info{flex:1;}
  .team{font-size:2vw;font-weight:800;}
  .child{font-size:1.2vw;color:var(--dim);}
  .time{font-size:2.8vw;font-weight:900;font-variant-numeric:tabular-nums;color:var(--green);
    text-shadow:0 0 30px rgba(40,224,122,.4);}
  .empty{text-align:center;color:var(--dim);font-size:1.6vw;margin-top:4vw;}
</style>
</head>
<body>
<div class="page">
  <!-- logo slot: swap src for your event / school / sponsor logo -->
  <div class="page-header">
    <img class="brand-logo" src="logo.png" alt="Event logo" onerror="this.style.display='none'">
    <div class="header-text">
      <h1>🏁 Leaderboard</h1>
      <div class="subtitle">EasyKids Robotics Racing</div>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">ยังไม่มีผลการแข่งขัน</div>
</div>

<script>
const WS_URL = `ws://${location.hostname}:1880/ws/gate`;
let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (ev)=>{
    const msg = JSON.parse(ev.data);
    if (msg.type === "leaderboard") render(msg.data);
  };
  ws.onclose = ()=> setTimeout(connect, 1500);
}
connect();

// initial load via REST in case ws hasn't pushed yet
fetch(`http://${location.hostname}:1880/api/leaderboard`)
  .then(r=>r.json()).then(render).catch(()=>{});

function fmtMs(ms){ return (ms/1000).toFixed(2) + " s"; }

function render(rows){
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  if (!rows || rows.length === 0){ list.innerHTML = ""; empty.style.display='block'; return; }
  empty.style.display = 'none';

  rows.sort((a,b)=> a.best_time_ms - b.best_time_ms);
  list.innerHTML = rows.map((r,i)=>`
    <div class="row" style="order:${i}">
      <div class="rank">#${i+1}</div>
      <div class="info">
        <div class="team">${r.team_name}</div>
        <div class="child">${r.child_name} • ${r.class_name}</div>
      </div>
      <div class="time">${fmtMs(r.best_time_ms)}</div>
    </div>`).join("");
}
</script>
</body>
</html>
