<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ฟอนต์ Prompt โหลดจากไฟล์ local (ไม่พึ่งอินเทอร์เน็ตหน้างาน) — วางไฟล์
     .woff2 (และ/หรือ .ttf สำรอง) ไว้ที่ web/fonts/ ตามชื่อไฟล์ด้านล่าง -->
<style>
@font-face{font-family:'Prompt';font-weight:400;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-Regular.woff2') format('woff2'),
      url('fonts/Prompt-Regular.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:500;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-Medium.woff2') format('woff2'),
      url('fonts/Prompt-Medium.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:600;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-SemiBold.woff2') format('woff2'),
      url('fonts/Prompt-SemiBold.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:700;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-Bold.woff2') format('woff2'),
      url('fonts/Prompt-Bold.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:800;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-ExtraBold.woff2') format('woff2'),
      url('fonts/Prompt-ExtraBold.ttf') format('truetype');}
@font-face{font-family:'Prompt';font-weight:900;font-style:normal;font-display:swap;
  src:url('fonts/Prompt-Black.woff2') format('woff2'),
      url('fonts/Prompt-Black.ttf') format('truetype');}
</style>
<style>
  :root{
    /* ===== EasyKids Robotics theme tokens ===== */
    --void:#0a0518; --void-2:#170a2e;
    --brand:#7c3aed; --brand-bright:#a78bfa;
    --panel:#160d29; --panel-2:#1d1139;
    --line:rgba(167,139,250,.22);
    --ink:#f5f2ff; --dim:#9384b8;
    /* podium colors — unchanged meaning */
    --gold:#ffd166;--silver:#cdd6e5;--bronze:#e0a672;--green:#28e07a;
  }
  *{box-sizing:border-box;}
  body{margin:0;
    font-family:'Prompt','Segoe UI',Tahoma,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 60vw 60vw at 6% -4%, rgba(124,58,237,.32), transparent 60%),
      radial-gradient(ellipse 55vw 55vw at 96% 100%, rgba(40,224,122,.10), transparent 60%),
      linear-gradient(160deg, var(--void) 0%, var(--void-2) 55%, var(--void) 100%);
    padding:3vw 4vw;
    min-height:100vh;
  }
  /* subtle circuit-grid texture, purely decorative */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(167,139,250,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,.05) 1px, transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, black 0%, transparent 75%);
            mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, black 0%, transparent 75%);
  }

  .page{position:relative;z-index:1;max-width:1400px;margin:0 auto;}

  /* ===== logo slots — มุมบนซ้าย+ขวา ===== */
  .corner-logo-left{position:fixed;top:2vh;left:2vw;z-index:5;}
  .corner-logo-right{position:fixed;top:2vh;right:2vw;z-index:5;}
  .brand-logo{height:64px;width:auto;display:block;
    filter:drop-shadow(0 2px 14px rgba(124,58,237,.55));}
  .brand-logo:not([src]),.brand-logo[src=""]{display:none;}

  .page-header{display:flex;align-items:center;justify-content:center;
    margin:0 0 2.2vw;flex-wrap:wrap;text-align:center;}
  .header-text h1{font-size:2.6vw;margin:0;letter-spacing:.05em;font-weight:800;}
  .header-text .subtitle{font-size:1.1vw;color:var(--dim);letter-spacing:.2em;
    text-transform:uppercase;font-weight:600;}
  .mode-pill{display:inline-block;margin-top:.4vw;padding:.35vw 1.1vw;border-radius:999px;
    font-size:1vw;font-weight:700;letter-spacing:.1em;border:1px solid var(--line);
    background:rgba(124,58,237,.12);color:var(--brand-bright);}
  .mode-pill.final{background:rgba(255,209,102,.12);color:var(--gold);
    border-color:rgba(255,209,102,.35);}

  .list{display:flex;flex-direction:column;gap:1vw;}
  .row{display:flex;align-items:center;gap:2vw;position:relative;overflow:hidden;
       background:linear-gradient(135deg, var(--panel), var(--panel-2));
       border:1px solid var(--line);border-radius:20px;padding:1.4vw 2vw 1.4vw 2.6vw;
       box-shadow:0 12px 34px rgba(0,0,0,.35);
       transition:transform .5s cubic-bezier(.4,0,.2,1), background .3s;}
  .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
    background:var(--brand);opacity:.45;}
  .row.rank-1::before{background:var(--gold);opacity:1;box-shadow:0 0 20px rgba(255,209,102,.6);}
  .row.rank-2::before{background:var(--silver);opacity:1;box-shadow:0 0 16px rgba(205,214,229,.4);}
  .row.rank-3::before{background:var(--bronze);opacity:1;box-shadow:0 0 16px rgba(224,166,114,.4);}

  .rank{font-size:2vw;font-weight:900;width:3.8vw;height:3.8vw;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:rgba(255,255,255,.03);border:2px solid var(--line);color:var(--dim);}
  .row.rank-1 .rank{color:#2a1806;border-color:var(--gold);
    background:linear-gradient(160deg,#ffe9b0,var(--gold));box-shadow:0 0 26px rgba(255,209,102,.5);}
  .row.rank-2 .rank{color:#1c2230;border-color:var(--silver);
    background:linear-gradient(160deg,#f2f5fa,var(--silver));box-shadow:0 0 20px rgba(205,214,229,.35);}
  .row.rank-3 .rank{color:#2e1809;border-color:var(--bronze);
    background:linear-gradient(160deg,#f3cd9e,var(--bronze));box-shadow:0 0 20px rgba(224,166,114,.35);}

  .info{flex:1;}
  .team{font-size:2vw;font-weight:800;}
  .child{font-size:1.2vw;color:var(--dim);}
  .time{font-size:2.8vw;font-weight:900;font-variant-numeric:tabular-nums;color:var(--green);
    text-shadow:0 0 30px rgba(40,224,122,.4);}
  .empty{text-align:center;color:var(--dim);font-size:1.6vw;margin-top:4vw;}
</style>
</head>
<body>
<!-- logo slots: swap src for your event / school / sponsor logos -->
<div class="corner-logo-left">
  <img class="brand-logo" src="logo-left.png" alt="Event logo" onerror="this.style.display='none'">
</div>
<div class="corner-logo-right">
  <img class="brand-logo" src="logo-right.png" alt="Sponsor logo" onerror="this.style.display='none'">
</div>

<div class="page">
  <div class="page-header">
    <div class="header-text">
      <h1 id="pageTitle">🏁 Leaderboard</h1>
      <div class="subtitle" id="pageSubtitle">EasyKids Robotics Racing</div>
      <div class="mode-pill" id="modePill">รอบคัดเลือก</div>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">ยังไม่มีผลการแข่งขัน</div>
</div>

<script>
const WS_URL = `ws://${location.hostname}:1880/ws/gate`;
let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (ev)=>{
    const msg = JSON.parse(ev.data);
    if (msg.type === "leaderboard") {
      if (msg.mode === "final") finalRows = msg.data;
      else normalRows = msg.data;
      render();
    } else if (msg.type === "state") {
      setMode(msg.data.mode);
    }
  };
  ws.onclose = ()=> setTimeout(connect, 1500);
}
connect();

// โหลดค่าตั้งต้นของทั้ง 2 กระดานตอนเปิดหน้า (เผื่อ ws ยังไม่ทันส่งมา)
let normalRows = [];
let finalRows = [];
let currentMode = 'normal';

fetch(`http://${location.hostname}:1880/api/leaderboard`)
  .then(r=>r.json()).then(rows=>{ normalRows = rows; render(); }).catch(()=>{});
fetch(`http://${location.hostname}:1880/api/leaderboard?mode=final`)
  .then(r=>r.json()).then(rows=>{ finalRows = rows; render(); }).catch(()=>{});
fetch(`http://${location.hostname}:1880/api/state`)
  .then(r=>r.json()).then(d=>{ if (d && d.mode) setMode(d.mode); }).catch(()=>{});

function setMode(mode){
  if (mode !== 'normal' && mode !== 'final') return;
  if (mode === currentMode) return;
  currentMode = mode;
  clearList();  // สลับโหมดจริงๆ ค่อย reset DOM (ไม่บ่อย ไม่ทำให้กระพริบระหว่างแข่ง)
  const pill = document.getElementById('modePill');
  const title = document.getElementById('pageTitle');
  const subtitle = document.getElementById('pageSubtitle');
  if (mode === 'final'){
    pill.textContent = 'รอบ Final';
    pill.classList.add('final');
    title.textContent = '🏆 Final Leaderboard';
    subtitle.textContent = 'EasyKids Robotics Racing — Final';
  } else {
    pill.textContent = 'รอบคัดเลือก';
    pill.classList.remove('final');
    title.textContent = '🏁 Leaderboard';
    subtitle.textContent = 'EasyKids Robotics Racing';
  }
  render();
}

function fmtMs(ms){ return (ms/1000).toFixed(2) + " s"; }

// ---------- keyed DOM reconciliation (กันกระพริบ) ----------
// เดิม: list.innerHTML = rows.map(...).join("") ทุกครั้งที่มีข้อความเข้ามา
// (ทั้งตอน confirm ผล และตอน periodic refresh ทุก 5 วิ) ทำลาย DOM node เดิม
// ทั้งหมดแล้วสร้างใหม่ แม้ข้อมูลจะเหมือนเดิมเป๊ะ -> กระพริบทุกครั้ง
// ตอนนี้เก็บ element ต่อทีมไว้ (key = participant_id) อัปเดตแค่ text/class/
// ตำแหน่ง (flex order) โดยไม่ทำลาย DOM node เดิมเลย
let elMap = new Map();

function clearList(){
  document.getElementById('list').innerHTML = '';
  elMap = new Map();
}

function ensureRow(key){
  let el = elMap.get(key);
  if (!el){
    el = document.createElement('div');
    el.className = 'row';
    el.dataset.key = key;
    el.innerHTML =
      '<div class="rank"></div>' +
      '<div class="info"><div class="team"></div><div class="child"></div></div>' +
      '<div class="time"></div>';
    document.getElementById('list').appendChild(el);
    elMap.set(key, el);
  }
  return el;
}

function setRankClass(el, rankIndex){
  el.classList.remove('rank-1','rank-2','rank-3');
  if (rankIndex === 0) el.classList.add('rank-1');
  else if (rankIndex === 1) el.classList.add('rank-2');
  else if (rankIndex === 2) el.classList.add('rank-3');
}

function render(){
  const rows = currentMode === 'final' ? finalRows : normalRows;
  const empty = document.getElementById('empty');
  if (!rows || rows.length === 0){
    clearList();
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // v_leaderboard/v_final_leaderboard เรียงมาให้แล้วจาก SQL แต่ normal mode
  // เรียงซ้ำอีกทีฝั่ง client กันเผื่อลำดับจาก periodic refresh คลาดเคลื่อน
  const sorted = currentMode === 'final'
    ? rows
    : [...rows].sort((a,b)=> a.best_time_ms - b.best_time_ms);

  const seenKeys = new Set();
  sorted.forEach((r,i)=>{
    const key = String(r.participant_id);
    seenKeys.add(key);
    const el = ensureRow(key);
    el.style.order = i;
    setRankClass(el, i);
    el.querySelector('.rank').textContent = `#${i+1}`;
    el.querySelector('.team').textContent = r.team_name;
    const timeEl = el.querySelector('.time');
    if (currentMode === 'final'){
      el.querySelector('.child').textContent = `${r.child_name} • Seed #${r.seed_rank}`;
      if (r.status === 'FINISH'){
        timeEl.textContent = fmtMs(r.robot_time_ms);
        timeEl.style.color = ''; timeEl.style.textShadow = '';
      } else {
        timeEl.textContent = r.status;
        timeEl.style.color = 'var(--dim)'; timeEl.style.textShadow = 'none';
      }
    } else {
      el.querySelector('.child').textContent = `${r.child_name} • ${r.class_name}`;
      timeEl.textContent = fmtMs(r.best_time_ms);
      timeEl.style.color = ''; timeEl.style.textShadow = '';
    }
  });

  // ลบแถวของทีมที่ไม่อยู่ในผลล่าสุดแล้ว (เผื่อกรณีแก้ไขข้อมูลย้อนหลัง)
  for (const [key, el] of elMap){
    if (!seenKeys.has(key)){
      el.remove();
      elMap.delete(key);
    }
  }
}
</script>
</body>
</html>
