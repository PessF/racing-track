<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#090c13;--panel:#121826;--line:#1e2636;--ink:#f2f5fa;--dim:#7783a0;
        --gold:#ffd166;--silver:#cdd6e5;--bronze:#e0a672;--green:#28e07a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,sans-serif;
       padding:3vw 4vw;}
  h1{font-size:2.6vw;margin:0 0 2vw;text-align:center;letter-spacing:.05em;}
  .list{display:flex;flex-direction:column;gap:1vw;}
  .row{display:flex;align-items:center;gap:2vw;background:var(--panel);
       border:1px solid var(--line);border-radius:16px;padding:1.4vw 2vw;
       transition:transform .5s cubic-bezier(.4,0,.2,1), background .3s;}
  .rank{font-size:2.6vw;font-weight:900;width:3.5vw;text-align:center;color:var(--dim);}
  .row:nth-child(1) .rank{color:var(--gold);}
  .row:nth-child(2) .rank{color:var(--silver);}
  .row:nth-child(3) .rank{color:var(--bronze);}
  .info{flex:1;}
  .team{font-size:2vw;font-weight:800;}
  .child{font-size:1.2vw;color:var(--dim);}
  .time{font-size:2.8vw;font-weight:900;font-variant-numeric:tabular-nums;color:var(--green);}
  .empty{text-align:center;color:var(--dim);font-size:1.6vw;margin-top:4vw;}
</style>
</head>
<body>
  <h1>🏁 Leaderboard</h1>
  <div class="list" id="list"></div>
  <div class="empty" id="empty">ยังไม่มีผลการแข่งขัน</div>

<script>
const WS_URL = `ws://${location.hostname}:1880/ws/gate`;
let ws;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onmessage = (ev)=>{
    const msg = JSON.parse(ev.data);
    if (msg.type === "leaderboard") render(msg.data);
  };
  ws.onclose = ()=> setTimeout(connect, 1500);
}
connect();

// initial load via REST in case ws hasn't pushed yet
fetch(`http://${location.hostname}:1880/api/leaderboard`)
  .then(r=>r.json()).then(render).catch(()=>{});

function fmtMs(ms){ return (ms/1000).toFixed(2) + " s"; }

function render(rows){
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  if (!rows || rows.length === 0){ list.innerHTML = ""; empty.style.display='block'; return; }
  empty.style.display = 'none';

  rows.sort((a,b)=> a.best_time_ms - b.best_time_ms);
  list.innerHTML = rows.map((r,i)=>`
    <div class="row" style="order:${i}">
      <div class="rank">#${i+1}</div>
      <div class="info">
        <div class="team">${r.team_name}</div>
        <div class="child">${r.child_name} • ${r.class_name}</div>
      </div>
      <div class="time">${fmtMs(r.best_time_ms)}</div>
    </div>`).join("");
}
</script>
</body>
</html>
